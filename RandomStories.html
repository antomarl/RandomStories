<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <title>Random Stories</title>
    <link rel="stylesheet" href="RandomStories.css">
  </head>
  <body class="state-generating">
    <button id="coloreTema"> cambia tema</button>
    <div class="scena">
      <div class="pc-wrapper">
        <img src="pc-background.png" alt="PC" class="pc-img">
        <section id="sectionGeneraParole" class="pannello">
          <h2> Genera Parole</h2>
          <div class="bottoni">
            <button id="btnGeneraParola">Genera parola</button>
            <button id="btnResetParole">Reset</button>
          </div>
          <p id="contatoreParole">Parole generate: 0/10</p>
          <div id="listaParole"></div>
            <!-- siccome gli alert fanno shifo,voglio torglierli -->
          <div id="messaggioPC" class="messaggio"></div>
        </section>
      </div>
      <div class="notebook-wrapper">
        <img src="notebook-background.png" alt="Quaderno" class="notebook-img">
        <section id="SectionStoria" class="pannello">
          <h2>Scrivi la tua storia!</h2>
          <p id="indicatorePagina">Pagina 1</p>
          <!-- dato che tutti mi hanno detto di rendere più realistico il sito,ora creo 2 textarea-->
           <div id="contenitorePagine"> <!--si chiama così appunto perchè verra usata come scatola delle 2 textarea,e poi sara più facile modificarle nelll css-->
            <textarea id="storyInputSx" class="story-input" placeholder="Scrivi qui la tua storia..."></textarea>
            <textarea id="storyInputDx" class="story-input"></textarea>
           </div>
          <div id="messaggioErrore"></div>
          <button id="btnSalva" disabled>Salva Storia</button>
        </section>
      </div> 
    </div>
    <header class="intestazione">
      <h1>Random Stories</h1>
      <p class="istruzioni"> Genera fino a 10 parole casuali del vocabolario italiani,poi scrivi una storia che le contenga tutte!! premi <kbd>F3</kbd>per cambiare zona!, <kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd> per cambiare pagina. </p>  
    </header>
    <script src="paroleLista.js"></script>
    <script src="RandomStories.js"></script>
  </body>
</html>
