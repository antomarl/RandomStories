<!DOCTYPE html>
<html>
  <head>
    <title>Random Stories</title>
    <link rel="stylesheet" href="RandomStories.css">
  </head>
  <body>
    <div class="container">
      <h1>Random Stories</h1>
      <p class="istruzioni">Genera 10 parole casuali, poi scrivi una storia che le contenga tutte!</p>
      <section id="sectionGeneraParole">
        <h2><strong>Genera Parole</strong></h2>
        <button id="btnGeneraParola">Genera una parola casuale</button>
        <button id="btnResetParole">Reset parole</button>
        <p id="contatoreParole">Parole generate: 0/10</p>
        <div id="listaParole"></div>
      </section>
      
      <section id="SectionStoria">
        <h2><strong>Scrivi la storia</strong></h2>
        <textarea id="storyInput" placeholder="Scrivi qui la tua storia..."></textarea>
      </section>
      
      <section id="sectionSalvataggio">
        <div id="messaggioErrore"></div>
        <button id="btnSalva">Salva Storia</button>
      </section>
    </div>
    
    <script src="RandomStories.js"></script>
  </body>
</html>
